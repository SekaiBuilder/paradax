name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and how to reproduce it
      description: If it was a run, attach the relevant part of its log from the Activity area.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version and Ollama model
      placeholder: macOS 15 · Python 3.11 · qwen3-coder:30b
